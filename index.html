<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Blackjack contre la banque : sabot de 6 jeux, conseiller de stratégie de base et probabilités en direct.">
<meta name="theme-color" content="#170e0c">
<meta property="og:title" content="Le Sabot Blackjack">
<meta property="og:description" content="Blackjack contre la banque : sabot de 6 jeux, conseiller de stratégie de base et probabilités en direct.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='6' width='40' height='54' rx='6' fill='%23fbf8f1' stroke='%23c9a45c' stroke-width='3'/%3E%3Ctext x='30' y='44' font-size='30' text-anchor='middle' font-family='Georgia,serif' fill='%23b3172b'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<title>Sabot Blackjack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500;1,6..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one felt table seen from the player's side — dealer at the top rail, printed arc, five seats along the curve, a personal control dock pinned below. Single dark visual world (casino room). */
:root{
  color-scheme: dark;
  --room:#170e0c; --room-2:#21140f; --rail:#2c1a12; --rail-hi:#4a2c1d;
  --brass:#c9a45c; --brass-hi:#e7cb8d; --brass-ink:#2a1a0e;
  --felt:#6b1d2a; --felt-lo:#3e0d16; --felt-hi:#86293b;
  --ink:#f2e7cf; --ink-dim:#c4b195; --ink-faint:#8f7d66; --print:rgba(242,231,207,.5);
  --card:#fbf8f1; --card-edge:#e4dccb; --card-red:#b3172b; --card-black:#18181c;
  --win:#93d6a3; --lose:#f19084; --push:#dccb92;
  --chip25:#2f7d55; --chip100:#26262a; --chip500:#6c4ba3; --chip1000:#d0862a; --chip5000:#2c5fa6; --chip-edge:#f4ecd9;
  --font-display:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;
  --font-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --c-hit:#7c2b37; --c-stand:#3c5c43; --c-dbl:#c09748; --c-split:#2f5487; --hint-dim:#6d5c47;
  --gold-hi:#ffd56b; --bulb-off:#5a3c1c; --bulb-on:#ffe2a0;
  --cw:52px; --cw-dealer:62px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--room)}
body{
  color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  background:radial-gradient(120% 70% at 50% 0%,var(--room-2),var(--room) 70%) fixed,var(--room);
  padding-inline:16px;padding-block:20px 0;min-height:100vh;
}
.wrap{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.brand h1{font-family:var(--font-display);font-weight:500;font-style:italic;font-size:clamp(28px,4.4vw,40px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand h1 b{font-style:normal;font-weight:700;color:var(--brass-hi)}
.brand p{margin:6px 0 0;color:var(--ink-dim);font-size:13px}
.meta{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.shoe{display:flex;align-items:center;gap:8px}
.shoe-bar{position:relative;width:96px;height:6px;border-radius:3px;background:var(--rail-hi);overflow:hidden}
.shoe-bar i{position:absolute;inset:0 auto 0 0;background:var(--brass);border-radius:3px}
.shoe-bar u{position:absolute;top:-2px;bottom:-2px;left:25%;width:2px;background:var(--card-red)}

.banner{border:1px dashed var(--ink-faint);color:var(--ink-dim);padding:8px 12px;border-radius:8px;font-size:13px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;flex-direction:column;gap:2px;margin-inline:-16px;margin-top:-12px;padding:10px 16px 8px;background:linear-gradient(var(--room) 78%,rgba(23,14,12,0))}
.appbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-mini{font-family:var(--font-display);font-style:italic;font-size:22px;line-height:1}
.brand-mini b{font-style:normal;font-weight:700;color:var(--brass-hi)}
.appbar-actions{display:flex;gap:8px;align-items:center}
.icon-btn{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--brass);background:var(--rail);color:var(--brass-hi);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover,.icon-btn[aria-pressed="true"]{background:var(--rail-hi)}
.icon-btn .dot{position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:50%;background:var(--brass-hi);box-shadow:0 0 0 2px var(--room)}
.rules-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--ink-dim)}
.info-admin{border-top:1px solid var(--rail-hi);padding-top:10px}
.statusbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-inline:-16px;padding:8px 16px;background:linear-gradient(var(--room) 72%,rgba(23,14,12,0))}
.status{min-height:24px;font-size:15px;color:var(--ink-dim);font-variant-numeric:tabular-nums;min-width:0}
.adv-btn{flex:none;border:1px solid var(--brass);background:var(--rail);color:var(--brass-hi);font-weight:600;font-size:13.5px;padding:7px 13px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.adv-btn:hover,.adv-btn[aria-pressed="true"]{background:var(--rail-hi)}
.status strong{color:var(--ink);font-weight:600}

/* Table */
.table{
  --rail-w:14px;
  position:relative;
  background:radial-gradient(90% 75% at 50% 18%,var(--felt-hi),var(--felt) 45%,var(--felt-lo) 100%);
  border:var(--rail-w) solid var(--rail);
  border-radius:44px 44px 50% 50% / 44px 44px 30% 30%;
  box-shadow:inset 0 0 0 2px var(--brass),inset 0 0 60px rgba(0,0,0,.45),0 0 0 1px var(--rail-hi),0 24px 60px rgba(0,0,0,.55);
  padding:22px 18px 92px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.dealer{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:calc(var(--cw-dealer)*1.4 + 40px)}
.dealer .cards{--cw:var(--cw-dealer)}
.dealer .cards .card+.card{margin-left:calc(var(--cw)*-.34)}
.d-label{font-family:var(--font-display);font-style:italic;font-size:15px;color:var(--print);letter-spacing:.04em;display:flex;gap:10px;align-items:baseline}
.d-label .hv{font-style:normal}
.arc{width:min(100%,760px);height:auto;display:block;margin-top:-6px;pointer-events:none}
.arc text{font-family:var(--font-display);fill:var(--print);letter-spacing:.18em}
.arc .l1{font-size:23px;font-weight:700}
.arc .l2{font-size:13px;letter-spacing:.24em}
.arc path.line{fill:none;stroke:var(--print);stroke-width:1;opacity:.6}

.seats{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:4px}
.seat{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;transition:transform .3s}
@media (min-width:761px){
  .seat:nth-child(2),.seat:nth-child(4){transform:translateY(34px)}
  .seat:nth-child(3){transform:translateY(50px)}
}
.hands{display:flex;justify-content:center;align-items:flex-end;gap:6px;flex-wrap:wrap;min-height:calc(var(--cw)*1.4 + 26px);width:100%}
.hand{display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px;border-radius:10px;transition:box-shadow .2s,background .2s}
.hand.active{background:rgba(231,203,141,.12);box-shadow:0 0 0 2px var(--brass-hi),0 0 22px rgba(231,203,141,.35)}
.hand.r-lose,.hand.r-bust{opacity:.62}
.cards{display:flex;justify-content:center}
.cards .card+.card{margin-left:calc(var(--cw)*-.6)}
.hmeta{display:flex;gap:5px;align-items:center;font-size:12px;flex-wrap:wrap;justify-content:center}
.hv{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(0,0,0,.35);color:var(--ink);padding:1px 7px;border-radius:999px;font-size:12px}
.hv.bust{color:var(--lose)}
.hb{color:var(--ink-dim);font-variant-numeric:tabular-nums}
.res{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.35)}
.res.win,.res.bj{color:var(--win)}
.res.lose,.res.bust{color:var(--lose)}
.res.push{color:var(--push)}

.spot{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--print);display:grid;place-items:center;position:relative;flex:none}
.spot.is-ready{border-color:var(--brass-hi);box-shadow:0 0 0 3px rgba(231,203,141,.18)}
.spot-n{font-family:var(--font-display);font-style:italic;color:var(--print);font-size:20px}
.spot .amt{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--brass-ink);color:var(--brass-hi);font-size:11px;font-weight:700;padding:0 6px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stack{display:grid}
.stack .chip{grid-area:1/1}
.plate{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0;max-width:100%;margin-top:4px}
.nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.nm em{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass-ink);background:var(--brass);padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:1px}
.sub{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.tag.ok{color:var(--brass-hi);font-weight:600}
.afk{font-size:11px;font-weight:600;color:var(--lose);font-variant-numeric:tabular-nums}
.dock-stack{display:flex;flex-direction:column;gap:10px;width:100%}
.dock-warn{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;background:rgba(241,144,132,.12);border:1px solid var(--lose);border-radius:9px;padding:6px 8px 6px 12px;font-size:13.5px;font-variant-numeric:tabular-nums}
.dock-warn b{color:var(--lose)}
.net.up{color:var(--win);font-weight:600}
.net.down{color:var(--lose);font-weight:600}
.seat.empty .plate .nm{color:var(--ink-faint);font-weight:500}
.seat.turn .nm{color:var(--brass-hi)}

/* Cards */
.card{
  width:var(--cw);aspect-ratio:5/7;flex:none;position:relative;border-radius:calc(var(--cw)*.1);
  background:var(--card);color:var(--card-black);font-family:var(--font-display);
  box-shadow:0 0 0 1px var(--card-edge),0 1px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.38);
}
.card.red{color:var(--card-red)}
.idx{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.92;font-size:calc(var(--cw)*.27);font-weight:700}
.idx i{font-style:normal;font-size:.78em;font-weight:500}
.idx.tl{top:5%;left:8%}
.idx.br{bottom:5%;right:8%;transform:rotate(180deg)}
.pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.52);line-height:1}
.pip.face{inset:20% 22%;border:1px solid currentColor;border-radius:3px;font-style:italic;font-weight:700;font-size:calc(var(--cw)*.46)}
.card.back{background:repeating-linear-gradient(45deg,var(--felt-lo) 0 4px,var(--felt-hi) 4px 8px);border:3px solid var(--card)}
.card.back::after{content:"";position:absolute;inset:2px;border:1px solid var(--brass);border-radius:calc(var(--cw)*.06)}
@keyframes deal{from{transform:translate(0,-70px) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.card.deal{animation:deal .4s cubic-bezier(.2,.8,.25,1) both}
/* Dealer draws glide in from the shoe side, one at a time; the hole card turns over */
@keyframes deal-d{0%{transform:translate(calc(var(--cw)*1.5),-30px) rotate(4deg);opacity:0}40%{opacity:1}100%{transform:none;opacity:1}}
.card.deal-d{animation:deal-d .65s cubic-bezier(.22,.61,.36,1) both}
@keyframes flip{0%{transform:perspective(700px) rotateY(-90deg)}100%{transform:perspective(700px) rotateY(0)}}
.card.flip{animation:flip .5s cubic-bezier(.22,.61,.36,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .35s ease both}

/* Chips */
.chip{
  --c:var(--chip25);width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle,var(--c) 0 50%,var(--chip-edge) 51% 54%,transparent 55%),repeating-conic-gradient(var(--c) 0 30deg,var(--chip-edge) 30deg 45deg);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.28),0 2px 3px rgba(0,0,0,.45);
}

/* Dock */
.dock{
  position:sticky;bottom:0;z-index:5;margin-inline:-16px;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--room) 70%,rgba(23,14,12,0));
}
.dock-inner{max-width:1080px;margin-inline:auto;background:var(--rail);border:1px solid var(--rail-hi);box-shadow:inset 0 1px 0 rgba(231,203,141,.18),0 -8px 30px rgba(0,0,0,.4);border-radius:14px;padding:12px 16px;min-height:72px;display:flex;align-items:center}
.dock-row{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;width:100%}
.dock-info{display:flex;align-items:baseline;gap:8px;min-width:0}
.dock-info .lbl{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.08em}
.dock-info .big{font-family:var(--font-display);font-weight:700;font-size:28px;color:var(--brass-hi);font-variant-numeric:tabular-nums;line-height:1}
.dock-msg{margin:0;color:var(--ink-dim);flex:1;min-width:200px}
.chipbtns{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--chip-edge);
  background:radial-gradient(circle,var(--c) 0 48%,var(--chip-edge) 49% 52%,transparent 53%),repeating-conic-gradient(var(--c) 0 30deg,var(--chip-edge) 30deg 45deg);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.3),0 3px 6px rgba(0,0,0,.45);transition:transform .12s}
.chipbtn:hover:not(:disabled){transform:translateY(-3px)}
.chipbtn:disabled{opacity:.35;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{border:1px solid var(--brass);background:transparent;color:var(--ink);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center;transition:background .15s,color .15s}
.btn:hover:not(:disabled){background:rgba(201,164,92,.15)}
.btn.primary{background:var(--brass);color:var(--brass-ink)}
.btn.primary:hover:not(:disabled){background:var(--brass-hi)}
.btn.ghost{border-color:transparent;color:var(--ink-dim)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn kbd{font-family:var(--font-body);font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.65}
body.busy .dock .btn,body.busy .dock .chipbtn,body.busy .seat .btn{pointer-events:none;opacity:.6}

/* Lower panels */
.panels{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-top:6px}
.panel{background:rgba(44,26,18,.55);border:1px solid var(--rail-hi);border-radius:12px;padding:14px 16px;min-width:0}
.panel h2{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:18px;margin:0 0 8px;color:var(--brass-hi)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--ink-dim)}
.log b{color:var(--ink);font-weight:600}
.log .rd{font-variant-numeric:tabular-nums;color:var(--ink-faint);font-size:11px;margin-right:6px}
.empty-note{color:var(--ink-faint);font-size:13px;margin:0}
.board{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.board td{padding:4px 0;border-bottom:1px solid rgba(74,44,29,.7)}
.board td:last-child{text-align:right}
.board .away{color:var(--ink-faint);font-size:11px;margin-left:6px}
.rules{font-size:12px;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:center;padding-bottom:8px}
.rules ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--brass);color:var(--brass-ink);font-weight:600;padding:9px 16px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:20;max-width:calc(100% - 32px);font-size:14px}

/* Advisor window: basic-strategy chart + live odds from the shoe */
.adv-btn kbd,.adv-head kbd{font-family:var(--font-body);font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.65}
.advisor{
  position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:12;
  width:min(390px,calc(100vw - 32px));max-height:calc(100vh - 240px);overflow:auto;overscroll-behavior:contain;
  background:var(--rail);border:1px solid var(--brass);border-radius:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(231,203,141,.2);
  padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;font-size:13.5px;
}
.adv-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.adv-head h2{margin:0;font-family:var(--font-display);font-style:italic;font-weight:500;font-size:20px;color:var(--brass-hi)}
.adv-x{border:0;background:transparent;color:var(--ink-dim);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.adv-x:hover{color:var(--ink);background:var(--rail-hi)}
.adv-note{margin:0;color:var(--ink-dim)}
.adv-call{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.adv-move{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;padding:6px 14px;border-radius:9px;color:var(--ink)}
.adv-move.hit{background:var(--c-hit)} .adv-move.stand{background:var(--c-stand)}
.adv-move.double{background:var(--c-dbl);color:var(--brass-ink)} .adv-move.split{background:var(--c-split)}
.adv-cite{color:var(--ink-dim);font-size:12.5px;line-height:1.35}
.adv-cite b{color:var(--ink)}
.adv-why{margin:0;line-height:1.5}
.adv-alt{margin:0;font-size:12.5px;color:var(--brass-hi);border-left:2px solid var(--brass);padding-left:8px}
.adv-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adv-stat{background:rgba(0,0,0,.25);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.adv-stat span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-dim)}
.adv-stat b{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.adv-ev{display:flex;flex-direction:column;gap:5px}
.adv-ev h3,.adv-chart h3{margin:0 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);font-weight:600}
.adv-sec{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--rail-hi)}
.adv-sec h3{margin:0;font-family:var(--font-display);font-style:italic;font-weight:500;font-size:16px;color:var(--ink);text-transform:none;letter-spacing:0}
.odds{display:flex;flex-direction:column;gap:5px}
.odds-top,.ev2-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.odds-l,.ev2-l{font-size:14px;color:var(--ink);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.odds-v,.ev2-v{font-family:var(--font-display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev2-v small{font-family:var(--font-body);font-size:11px;font-weight:500;color:var(--ink-dim)}
.odds-n{margin:0;font-size:12.5px;color:var(--ink-dim)}
.good{color:var(--win)} .bad{color:var(--lose)}
.meter{height:10px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--ink-faint)}
.meter i.good{background:var(--win)} .meter i.bad{background:var(--lose)}
.ev2{display:flex;flex-direction:column;gap:5px;padding:8px 10px;border-radius:9px;background:rgba(0,0,0,.18)}
.ev2.is-best{background:rgba(231,203,141,.1);box-shadow:inset 0 0 0 1px var(--brass)}
.etag{flex:none;font-style:normal;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px}
.etag.best{background:var(--brass);color:var(--brass-ink)}
.etag.chart{border:1px solid var(--ink-faint);color:var(--ink-dim)}
.gauge{position:relative;display:flex;height:12px;border-radius:6px;overflow:visible}
.gauge .z{opacity:.55}
.gauge .z.bad{flex:3;background:var(--lose);border-radius:6px 0 0 6px} .gauge .z.mid{flex:3;background:var(--ink-faint)} .gauge .z.good{flex:2;background:var(--win);border-radius:0 6px 6px 0}
.gauge i{position:absolute;top:-4px;width:4px;height:20px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--rail)}
.gauge-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-dim)}
.adv-chart{border-top:1px solid var(--rail-hi);padding-top:10px}
.adv-chart summary{cursor:pointer;font-family:var(--font-display);font-style:italic;font-size:16px;color:var(--ink);padding:4px 0;list-style-position:inside}
.adv-chart[open] summary{margin-bottom:6px}
.ev-row{display:grid;grid-template-columns:62px 1fr 64px;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.ev-row.best .ev-l{color:var(--brass-hi);font-weight:700}
.ev-bar{position:relative;height:10px;background:rgba(0,0,0,.3);border-radius:5px}
.ev-bar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink-faint)}
.ev-bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.ev-bar i.pos{left:50%;background:var(--win)}
.ev-bar i.neg{right:50%;background:var(--lose)}
.ev-v{text-align:right;font-size:12.5px}
.adv-tabs{display:flex;gap:4px;margin-bottom:6px}
.adv-tabs button{flex:1;border:1px solid var(--rail-hi);background:transparent;color:var(--ink-dim);padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600}
.adv-tabs button[aria-pressed="true"]{background:var(--rail-hi);color:var(--ink);border-color:var(--brass)}
.chart-wrap{overflow-x:auto}
.chart{border-collapse:separate;border-spacing:2px;width:100%;font-size:11px;font-variant-numeric:tabular-nums;text-align:center}
.chart th{color:var(--ink-dim);font-weight:600;padding:2px 0}
.chart th.rh{text-align:right;padding-right:4px;white-space:nowrap}
.chart th.on{color:var(--brass-hi)}
.chart td{padding:3px 0;border-radius:3px;font-weight:700;color:var(--ink);min-width:20px}
.chart td.H{background:var(--c-hit)} .chart td.S{background:var(--c-stand)}
.chart td.D,.chart td.Ds{background:var(--c-dbl);color:var(--brass-ink)} .chart td.P{background:var(--c-split)}
.chart tr.on td{opacity:1}
.chart.has-hl td{opacity:.55}
.chart.has-hl tr.on td,.chart.has-hl td.col{opacity:.9}
.chart td.hl{opacity:1!important;outline:2px solid var(--brass-hi);outline-offset:1px;box-shadow:0 0 12px rgba(231,203,141,.6)}
.chart-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:11.5px;color:var(--ink-dim)}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.adv-opt{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-dim);cursor:pointer}
.adv-opt input{accent-color:var(--brass);width:16px;height:16px}
.adv-scrim{display:none}

/* "Best move" bubble, pinned to the recommended button in the dock */
.btn.rec{box-shadow:0 0 0 2px var(--brass-hi),0 0 18px rgba(231,203,141,.5)}
.hint{position:fixed;left:16px;top:0;z-index:14;width:min(300px,calc(100vw - 32px));background:var(--card);color:var(--card-black);border-radius:12px;padding:9px 12px 10px;box-shadow:0 14px 34px rgba(0,0,0,.55);font-size:13px;line-height:1.4}
.hint.pop{animation:hint-in .28s cubic-bezier(.22,.61,.36,1) both}
@keyframes hint-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hint-arrow{position:absolute;bottom:-7px;left:50%;width:14px;height:14px;background:var(--card);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.hint.below .hint-arrow{bottom:auto;top:-7px}
.hint-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint-kicker{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--hint-dim);font-weight:700}

.hint-main{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.hint-move{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.1}
.hint-move.hit{color:var(--c-hit)} .hint-move.stand{color:var(--c-stand)} .hint-move.double{color:#8a6420} .hint-move.split{color:var(--c-split)}
.hint-cell{font-size:12px;color:var(--hint-dim);font-variant-numeric:tabular-nums}
.hint-why{margin:4px 0 0}
.hint-more{border:0;background:transparent;padding:0;margin-top:4px;color:var(--c-split);font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* ---------- Juice: lights, camera, overlays ---------- */
html{overflow-x:hidden}
.cam,.cam-zoom{position:relative;will-change:transform}
.table>.dealer,.table>.arc,.table>.seats{position:relative;z-index:1}
.lights{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black)}
.lights .ambient{position:absolute;inset:-25%;background:radial-gradient(38% 30% at 30% 30%,rgba(255,196,120,.12),transparent 70%),radial-gradient(34% 26% at 72% 64%,rgba(255,110,160,.08),transparent 70%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(7%,-5%) rotate(5deg)}}
.lights .beams{position:absolute;left:50%;top:0;width:260%;aspect-ratio:1;transform:translate(-50%,-50%);opacity:0;transition:opacity .6s;mix-blend-mode:screen;
  background:conic-gradient(from 115deg,transparent 0deg 4deg,rgba(255,213,107,.38) 10deg,transparent 16deg 40deg,rgba(255,122,182,.32) 46deg,transparent 52deg 62deg,rgba(127,227,255,.3) 68deg,transparent 74deg 98deg,rgba(165,139,255,.32) 104deg,transparent 110deg 360deg)}
.table.party .beams{opacity:1;animation:beams 1.7s ease-in-out infinite alternate}
@keyframes beams{from{transform:translate(-50%,-50%) rotate(-28deg)}to{transform:translate(-50%,-50%) rotate(28deg)}}
.lights .spot-dim{position:absolute;left:50%;top:70%;width:1800px;height:1800px;transform:translate(-50%,-50%);background:radial-gradient(circle,transparent 0 95px,rgba(12,3,6,.42) 250px);opacity:0;transition:opacity .45s,left .5s cubic-bezier(.3,.7,.3,1),top .5s cubic-bezier(.3,.7,.3,1)}
.sweep{position:absolute;top:-10%;bottom:-10%;left:0;width:45%;background:linear-gradient(90deg,transparent,rgba(255,236,190,.2) 45%,rgba(255,250,235,.32) 50%,rgba(255,236,190,.2) 55%,transparent);mix-blend-mode:screen;transform:translateX(-120%)}
.marquee{position:absolute;left:calc(-1 * var(--rail-w));top:calc(-1 * var(--rail-w));width:calc(100% + 2 * var(--rail-w));height:calc(100% + 2 * var(--rail-w));pointer-events:none;z-index:2;overflow:visible}
.marquee path{fill:none;stroke-linecap:round}
.bulbs-base{stroke:var(--bulb-off);stroke-width:5;stroke-dasharray:.01 9.99}
.bulbs-lit{stroke:var(--bulb-on);stroke-width:5;stroke-dasharray:.01 19.99;filter:drop-shadow(0 0 3px rgba(255,205,110,.95));animation:chase 1.4s steps(2) infinite}
.table.myturn .bulbs-lit{animation-duration:.6s}
.table.party .bulbs-lit{animation:chase .2s steps(2) infinite,bulbhue 1s linear infinite;filter:drop-shadow(0 0 5px rgba(255,225,150,1))}
@keyframes chase{to{stroke-dashoffset:-20}}
@keyframes bulbhue{0%,100%{stroke:#ffe2a0}25%{stroke:#ff8fc4}50%{stroke:#8fe9ff}75%{stroke:#c3b0ff}}
.table{transition:box-shadow .5s}
.table.party{box-shadow:inset 0 0 0 2px var(--brass-hi),inset 0 0 60px rgba(0,0,0,.3),0 0 0 1px var(--rail-hi),0 24px 60px rgba(0,0,0,.55),0 0 90px rgba(255,190,90,.38)}

.seat.me .hand.active{animation:myturn 1.2s ease-in-out infinite}
@keyframes myturn{0%,100%{box-shadow:0 0 0 2px var(--brass-hi),0 0 18px rgba(231,203,141,.3)}50%{box-shadow:0 0 0 3px var(--gold-hi),0 0 36px rgba(255,213,107,.65)}}
.hv.t21{background:linear-gradient(90deg,#b8862f,#ffe08a,#b8862f);background-size:200% 100%;color:var(--brass-ink);animation:shimmer 1.6s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.chips-n{display:inline-block;transition:color .3s}
.chips-n.rolling{color:var(--gold-hi);font-weight:700;transform:scale(1.08)}
.streak{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;color:#2a1004;background:linear-gradient(90deg,#ffb02e,#ff5a1f);box-shadow:0 0 12px rgba(255,120,40,.6);animation:flame 1.1s ease-in-out infinite alternate}
@keyframes flame{to{box-shadow:0 0 20px rgba(255,140,50,.95);filter:brightness(1.15)}}
#dock.ping{animation:dockping .9s ease-out}
@keyframes dockping{0%{box-shadow:inset 0 1px 0 rgba(231,203,141,.18),0 0 0 0 rgba(255,213,107,.9)}100%{box-shadow:inset 0 1px 0 rgba(231,203,141,.18),0 0 0 20px rgba(255,213,107,0)}}
#dock.urgent{border-color:var(--lose);animation:urgent .5s ease-in-out infinite alternate}
@keyframes urgent{to{box-shadow:inset 0 1px 0 rgba(231,203,141,.18),0 0 26px rgba(241,144,132,.6)}}
.btn{transition:background .15s,color .15s,transform .08s}
.btn:active:not(:disabled){transform:scale(.96)}
.chipbtn:active:not(:disabled){transform:translateY(1px) scale(.9)}

.flash{position:fixed;inset:0;pointer-events:none;z-index:25;opacity:0}
.flash.gold{background:radial-gradient(circle at 50% 45%,rgba(255,226,150,.55),rgba(255,200,90,.15) 45%,transparent 72%)}
.flash.white{background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.8),rgba(255,240,200,.3) 50%,transparent 78%)}
.flash.red{background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(179,23,43,.6) 100%)}
.overlay{position:fixed;inset:0;pointer-events:none;z-index:27;overflow:hidden}
.shout{position:absolute;transform:translate(-50%,-50%);width:min(94vw,1000px);padding:.16em .12em .1em;text-align:center;text-wrap:balance;font-family:var(--font-display);font-style:italic;font-weight:700;line-height:1;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fffaf0 0%,#ffe08a 38%,#e0a43a 62%,#fff1c4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #3a1d08) drop-shadow(0 0 22px rgba(255,196,92,.75))}
.shout small{display:block;margin-top:.35em;font-family:var(--font-body);font-style:normal;font-weight:800;font-size:.22em;letter-spacing:.24em;text-transform:uppercase}
.shout.s{font-size:clamp(28px,8vw,44px)}
.shout.m{font-size:clamp(40px,11vw,68px)}
.shout.l{font-size:clamp(50px,14vw,92px)}
.shout.xl{font-size:clamp(58px,17vw,128px)}
.shout.red{background-image:linear-gradient(180deg,#fff0ee,#ff9a8c 45%,#c4253a 70%,#ffd0c8);filter:drop-shadow(0 3px 0 #3a0a10) drop-shadow(0 0 22px rgba(255,80,80,.7))}
.shout.ivory{background-image:linear-gradient(180deg,#ffffff,#f2e7cf 60%,#c4b195);filter:drop-shadow(0 3px 0 #2a1a0e) drop-shadow(0 0 16px rgba(242,231,207,.45))}
.shout.fire{background-image:linear-gradient(0deg,#ff5a1f,#ffb02e 45%,#fff3b0);filter:drop-shadow(0 2px 0 #3a1004) drop-shadow(0 0 18px rgba(255,120,40,.85))}
.floaty{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 16px currentColor}
.floaty.gold{color:var(--gold-hi)} .floaty.lose{color:var(--lose)} .floaty.push{color:var(--ink)}
.floaty.s{font-size:18px} .floaty.m{font-size:24px} .floaty.l{font-size:34px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:28}
.chip.toss{position:fixed;left:0;top:0;z-index:29;pointer-events:none}

.settings{display:flex;flex-direction:column;gap:6px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.18);cursor:pointer}
.set-row span{display:flex;flex-direction:column;gap:2px;min-width:0}
.set-row b{font-weight:600;color:var(--ink)}
.set-row small{font-size:12px;color:var(--ink-dim)}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:14px;background:var(--rail-hi);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink-dim);transition:transform .2s,background .2s}
.switch:checked{background:var(--brass)}
.switch:checked::after{transform:translateX(18px);background:var(--brass-ink)}

body.no-fx .bulbs-lit,body.no-fx .lights .ambient,body.no-fx .seat.me .hand.active,body.no-fx .hv.t21,body.no-fx .streak,body.no-fx #dock.urgent{animation:none}
body.no-fx .beams{opacity:0!important;animation:none!important}
@media (max-width:760px){
  .table{--rail-w:10px}
  .bulbs-base,.bulbs-lit{stroke-width:4}
  .lights .spot-dim{background:radial-gradient(circle,transparent 0 70px,rgba(12,3,6,.42) 190px)}
}
@media (prefers-reduced-motion:reduce){
  .bulbs-lit,.lights .ambient,.seat.me .hand.active,.hv.t21,.streak,#dock.urgent,#dock.ping{animation:none}
  .beams{opacity:0!important;animation:none!important}

/* ---------- Table props: rack, shoe, discard tray ---------- */
.props{position:absolute;inset:0;pointer-events:none}
.rack{--rack-h:30px;position:absolute;z-index:3;left:50%;top:calc(-.5 * var(--rail-w) - var(--rack-h) / 2 + 6px);transform:translateX(-50%);width:min(320px,42%);height:var(--rack-h);display:flex;gap:3px;padding:4px 6px;border-radius:7px;
  background:linear-gradient(#0e0605,#1d0f0a);box-shadow:inset 0 0 0 1.5px var(--brass),inset 0 6px 10px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.45)}
.rack .tube{flex:1;position:relative;overflow:hidden;border-radius:3px;background:rgba(0,0,0,.5)}
.rack .tube i{position:absolute;left:0;right:0;bottom:0;height:var(--fill,85%);border-radius:3px;transition:height .7s cubic-bezier(.3,1.5,.5,1);
  background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.24) 45%,rgba(0,0,0,.38)),repeating-linear-gradient(180deg,var(--c) 0 2.5px,var(--chip-edge) 2.5px 3px,var(--c) 3px 4px,rgba(0,0,0,.45) 4px 4.6px)}
.shoe{position:absolute;z-index:1;top:16px;right:5.5%;width:104px;height:62px;transform:rotate(-8deg)}
.shoe::before{content:"";position:absolute;inset:6% 2% 0 6%;border-radius:8px 4px 10px 6px;background:linear-gradient(160deg,#2c1811,#110705 70%);box-shadow:inset 0 0 0 1.5px var(--brass),0 8px 14px rgba(0,0,0,.5);transform:skewX(-12deg)}
.shoe-stack{position:absolute;left:16%;top:24%;bottom:20%;width:calc(62% * var(--fill,1));border-radius:2px;transform:skewX(-12deg);transition:width .8s cubic-bezier(.3,.7,.3,1);
  background:repeating-linear-gradient(90deg,var(--card) 0 1px,var(--felt-hi) 1px 2.5px);box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.shoe-stack .cut{position:absolute;top:-2px;bottom:-2px;left:var(--cut,25%);width:2px;background:var(--card-red);box-shadow:0 0 4px rgba(255,80,80,.7)}
.shoe-mouth{position:absolute;right:-4%;top:30%;width:30%;height:36%;border-radius:3px;transform:rotate(14deg) skewX(-10deg);
  background:repeating-linear-gradient(45deg,var(--felt-lo) 0 3px,var(--felt-hi) 3px 6px);box-shadow:0 0 0 2px var(--card),0 3px 6px rgba(0,0,0,.5)}
.card.ghost{pointer-events:none}

/* Cards fly from the shoe's mouth */
@keyframes deal{from{transform:translate(var(--sx,0px),var(--sy,-70px)) rotate(-30deg) scale(.5);opacity:.3}55%{opacity:1}to{transform:none;opacity:1}}
.card.deal{animation:deal .5s cubic-bezier(.2,.8,.25,1) both}
@keyframes deal-d{0%{transform:translate(var(--sx,calc(var(--cw)*1.5)),var(--sy,-30px)) rotate(-24deg) scale(.55);opacity:.3}40%{opacity:1}100%{transform:none;opacity:1}}

/* ---------- Players: avatars, crown, turn ring ---------- */
.nm{padding-block:3px}
.crown{display:inline-block;width:15px;height:11px;margin-right:3px;vertical-align:0;background:var(--gold-hi);clip-path:polygon(0 100%,0 22%,26% 58%,50% 0,74% 58%,100% 22%,100% 100%);filter:drop-shadow(0 0 4px rgba(255,213,107,.9));animation:crown 2.4s ease-in-out infinite}
@keyframes crown{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-1px) rotate(6deg)}}
.seat.turn .spot::before{content:"";position:absolute;inset:-12px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 55%,rgba(255,213,107,0) 60%,rgba(255,213,107,.9) 82%,transparent 94%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}

<script>
(() => {
"use strict";
const SEATS = 5, START = 5000, MIN = 25, MAX = 5000, DECKS = 6;
const LEGACY_START = 1000; // players who joined before the limits went up started with 1 000
const TURN_MS = 30000, BET_MS = 15000, LOCK_MS = 1500;
const AFK_MS = 120000, WARN_MS = 30000; // 2 min without any action at the table: the seat is freed
const CHIPS = [25, 100, 500, 1000, 5000];
const chipLabel = v => v >= 1000 ? v / 1000 + "k" : String(v);
const SKIP = "__skip__";
const RANKS = "A23456789TJQK", SUITS = "SHDC";
const GLYPH = { S: "♠", H: "♥", D: "♦", C: "♣" };
const SUIT_NAME = { S: "pique", H: "cœur", D: "carreau", C: "trèfle" };
const LABEL = { T: "10", J: "V", Q: "D", K: "R" };
const RANK_NAME = { A: "As", T: "10", J: "Valet", Q: "Dame", K: "Roi" };
const RES = { bj: "Blackjack", win: "Gagné", push: "Égalité", lose: "Perdu", bust: "Sauté" };

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("fr-FR");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Card maths ---------- */
const cardVal = c => c[0] === "A" ? 11 : "TJQK".includes(c[0]) ? 10 : +c[0];
function handValue(cards) {
  let t = 0, a = 0;
  for (const c of cards) { t += cardVal(c); if (c[0] === "A") a++; }
  while (t > 21 && a) { t -= 10; a--; }
  return { total: t, soft: a > 0 };
}
const isBJ = h => h.cards.length === 2 && !h.fromSplit && handValue(h.cards).total === 21;
function rnd(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function freshShoe() {
  const cards = [];
  for (let d = 0; d < DECKS; d++) for (const s of SUITS) for (const r of RANKS) cards.push(r + s);
  for (let i = cards.length - 1; i > 0; i--) { const j = rnd(i + 1); [cards[i], cards[j]] = [cards[j], cards[i]]; }
  return cards.join("");
}
function draw(s) {
  if (s.shoe.length < 2) s.shoe = freshShoe();
  const c = s.shoe.slice(0, 2); s.shoe = s.shoe.slice(2); return c;
}

/* ---------- Game state ---------- */
function initState() {
  return { v: 1, rev: 0, phase: "betting", round: 0, shoe: freshShoe(),
    seats: Array(SEATS).fill(null), dealer: { cards: [], hidden: false },
    turn: null, turnAt: 0, readyAt: null, bank: {}, log: [] };
}
const buyinOf = x => x.buyin != null ? x.buyin : LEGACY_START * (1 + (x.rebuys || 0));
const newSeat = (uid, b) => ({ uid, chips: b ? b.chips : START, rebuys: b ? b.rebuys : 0, buyin: b ? buyinOf(b) : START,
  bet: 0, lastBet: 0, ready: false, hands: [], missed: 0, idle: 0, net: null, seen: null, kick: false });
const touch = (p, now) => { p.seen = now; p.missed = 0; p.kick = false; };
/* A seat is idle when its player has done nothing for AFK_MS and is not holding cards in the current donne. */
const idleDeadline = (s, p) => (p.ready || (s.phase === "playing" && p.hands.length) || p.seen == null) ? null : p.seen + AFK_MS;
const seatOf = (s, uid) => s.seats.findIndex(p => p && p.uid === uid);
function log(s, u, m) { s.log.push({ u, m, r: s.round }); if (s.log.length > 16) s.log.splice(0, s.log.length - 16); }
function unseat(s, i) { const p = s.seats[i]; s.bank[p.uid] = { chips: p.chips, rebuys: p.rebuys, buyin: buyinOf(p) }; s.seats[i] = null; }
function myTurn(s, uid) {
  if (s.phase !== "playing" || !s.turn) return null;
  const p = s.seats[s.turn.seat];
  if (!p || p.uid !== uid) return null;
  return { p, h: p.hands[s.turn.hand] };
}
const canSplit = (p, h) => h.cards.length === 2 && cardVal(h.cards[0]) === cardVal(h.cards[1])
  && p.hands.length < 4 && p.chips >= h.bet && !h.splitAces;

function deal(s, now) {
  if (s.shoe.length / 2 < DECKS * 52 * 0.25) { s.shoe = freshShoe(); log(s, null, "Le croupier mélange un nouveau sabot."); }
  s.round++;
  const players = [];
  s.seats.forEach(p => {
    if (!p) return;
    if (p.ready && p.bet >= MIN && p.bet <= p.chips) {
      p.chips -= p.bet; p.lastBet = p.bet; p.idle = 0;
      p.hands = [{ cards: [], bet: p.bet, done: false }];
      players.push(p);
    } else { p.hands = []; p.idle++; }

  if (shownRound !== null && state.round > shownRound && fxPrimed && motionOn())
    ghosts = (() => {   // measured by layout size, so a card caught mid-flip keeps its real size
      const tb = $("table"), k = tb.getBoundingClientRect().width / tb.offsetWidth || 1;
      return [...document.querySelectorAll("#dealer .card, #seats .card")].map(el => ({ el: el.cloneNode(true), r: el.getBoundingClientRect(), w: el.offsetWidth * k }));
    })();
  shownRound = state.round;
  const lead = computeLeader();
  if (fxPrimed && lead && lead !== leaderUid && lead === me) setTimeout(() => { const s = document.querySelector("#seats .seat.me .plate"); if (s) { const m = mid(s); floatText("En tête de la table", m.x, m.y - 40, "gold", "s"); sfx.sparkle(); } }, 900);
  leaderUid = lead;
  state.seats.forEach(seatHTML);   // first pass: registers new cards, so the dealer can wait for my card to turn over
  dealerAt = Math.max(0, Math.max(revealHold, revealRead) - renderNow);   // the dealer waits until my card has been read
  const dealerMarkup = dealerHTML();
  put("dealer", dealerMarkup);
  put("seats", state.seats.map(seatHTML).join(""));
  aimCards();
  clearTimeout(holdT);
  const nextAt = [revealHold, revealRead].filter(t => t > renderNow);
  if (nextAt.length) holdT = setTimeout(render, Math.min(...nextAt) - renderNow + 20);
  if (ghosts && ghosts.length) flyToTray(ghosts);
  renderProps();
  for (const k of born.keys()) if (!rendered.has(k)) born.delete(k);
  primed = true;
  clearTimeout(revealT);
  if (revealEnd > renderNow) revealT = setTimeout(render, revealEnd - renderNow + 30);
  put("status", statusHTML());
  put("dock", dockHTML());
  $("advisor").hidden = !advOpen; $("info").hidden = !infoOpen; $("advScrim").hidden = !(advOpen || infoOpen);
  $("infoBtn").setAttribute("aria-pressed", String(infoOpen));
  const lastLog = state.log.length ? JSON.stringify(state.log[state.log.length - 1]) : "";
  if (infoSeen === null || (infoOpen && infoTab === "log")) infoSeen = lastLog;
  $("infoDot").hidden = !lastLog || lastLog === infoSeen;
  if (infoOpen) put("info", infoHTML());
  const lb = $("advLaunch"); lb.setAttribute("aria-pressed", String(advOpen)); lb.firstChild.textContent = advOpen ? "Masquer " : "Conseils ";
  $("seats").classList.toggle("seated", seatOf(state, me) >= 0);
  if (advOpen) put("advisor", advisorHTML());
  placeHint();
  document.body.classList.toggle("no-fx", !fxSet.effects);
  $("table").classList.toggle("myturn", !!myTurn(state, me));
  renderSoundBtn();
  syncChips(); updateSpot(); updateFocus(); runFx(); playCardSounds();
  refreshNames();
}

let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* ---------- Input ---------- */
document.addEventListener("click", e => {
  sfx.unlock();
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled || !state) return;
  const a = b.dataset.act, arg = b.dataset.arg;
  if (a === "add") {
    const p = state.seats[seatOf(state, me)]; if (!p) return;
    const before = draft, from = b.getBoundingClientRect();
    draft = Math.min(draft + +arg, MAX, p.chips); render();
    if (draft > before) { tossChip(from, +arg); pop(document.querySelector("#dock .dock-info .big"), 1.18, 260); } else sfx.tap();
    return;
  }
  if (a === "clear") { draft = 0; sfx.whoosh(); render(); return; }
  if (a === "sound") return setFx("sound", !fxSet.sound);
  if (a === "level") { toast(`Niveau ${xp.lvl} · ${xp.xp} / ${xpNeed(xp.lvl)} XP. Chaque main en rapporte, les victoires et les blackjacks davantage.`); pop($("lvl"), 1.2, 300); return; }
  if (a === "advisor") return setAdvisor(!advOpen);
  if (a === "info") return setInfo(!infoOpen);
  if (a === "infotab") { infoTab = arg; render(); return; }
  if (a === "closesheets") { infoOpen = false; return setAdvisor(false); }
  if (a === "advtab") { advTabPinned = arg; render(); return; }
  if (a === "hint-x") { hintDismissed = $("hint").dataset.k; placeHint(); return; }
  if (a === "hint-why") return setAdvisor(true);
  if (a === "reset") {
    if (!resetArmed) { resetArmed = true; render(); setTimeout(() => { resetArmed = false; render(); }, 4000); return; }
    resetArmed = false; act("reset"); return;
  }
  if (a === "sit") return act("sit", +arg);
  if (a === "ready") { sfx.chips(4); pop(document.querySelector("#seats .seat.me .spot"), 1.15, 300); buzz(12); return act("ready", draft); }
  if (a === "hit" || a === "stand" || a === "double" || a === "split") sfx.tap();
  act(a);
});
document.addEventListener("keydown", e => {
  if (!state || e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  const k = e.key.toLowerCase();
  if (k === "c") { e.preventDefault(); setAdvisor(!advOpen); return; }
  if (k === "m") { e.preventDefault(); setFx("sound", !fxSet.sound); return; }
  if (k === "escape" && (advOpen || infoOpen)) { infoOpen = false; setAdvisor(false); return; }
  if (myTurn(state, me)) {
    const map = { t: "hit", r: "stand", d: "double", s: "split" };
    const btn = map[k] && document.querySelector(`#dock [data-act="${map[k]}"]`);
    if (btn && !btn.disabled) { e.preventDefault(); sfx.unlock(); sfx.tap(); act(map[k]); }
  } else if (k === "enter") {
    const btn = document.querySelector(`#dock [data-act="ready"]`);
    if (btn && !btn.disabled && document.activeElement === document.body) { e.preventDefault(); act("ready", draft); }
  }
});

/* ---------- Clock: countdowns + timeouts for absent players ---------- */
/* Any viewer who can write may run a due timeout: the table lock and the re-check inside each action keep it to one effect. */
let lastAuto = 0, warnSig = "", lastTickSec = 0;
setInterval(() => {
  document.querySelectorAll("[data-deadline]").forEach(el => { el.textContent = secsLeft(+el.dataset.deadline); });
  const mt = state && mode === "db" && myTurn(state, me);
  const left = mt ? Math.ceil((state.turnAt + TURN_MS - Date.now()) / 1000) : 99;
  $("dock").classList.toggle("urgent", left <= 5 && left > 0);
  if (left <= 5 && left > 0 && left !== lastTickSec) { lastTickSec = left; sfx.tick(left <= 3); if (left <= 3) buzz(10); }
  if (mode !== "db" || !state) return;
  const s = state, now = Date.now();
  const sig = s.seats.map(p => { const dl = p && idleDeadline(s, p); return dl != null && dl - now <= WARN_MS ? 1 : 0; }).join("");
  if (sig !== warnSig) { warnSig = sig; render(); }
  if (busy || readOnly || !canWrite || !me || now < lastAuto) return;
  let job = null;
  if (s.phase === "betting" && s.readyAt && now - s.readyAt >= BET_MS && s.seats.some(p => p && p.ready)) job = "autoDeal";
  else if (s.phase === "playing" && s.turn && now - s.turnAt >= TURN_MS) job = "autoStand";
  else if (s.seats.some(p => p && (p.seen == null || (idleDeadline(s, p) != null && now >= idleDeadline(s, p))))) job = "kickIdle";
  if (!job) return;
  lastAuto = now + 3000;
  setTimeout(() => act(job, null, { quiet: true }), Math.random() * 1200);
}, 1000);

/* ---------- Boot ---------- */
/* Solo games keep their chips on this device only. */
const SOLO_KEY = "sabot.solo";
function loadSolo() {
  try {
    const s = JSON.parse(localStorage.getItem(SOLO_KEY) || "null");
    if (s && s.v === 1 && Array.isArray(s.seats) && s.seats.length === SEATS && typeof s.shoe === "string") return s;
  } catch (e) {}
  return null;
}
function saveSolo() { try { localStorage.setItem(SOLO_KEY, JSON.stringify(state)); } catch (e) {} }
function startLocal(note) {
  mode = "local"; me = "solo";
  state = loadSolo();
  if (!state) { state = initState(); state.seats[2] = newSeat(me); }
  names[me] = "";
  soloNote = note;
  render();
}
async function boot() {
  const C = window.claude;
  if (!C || typeof C.use !== "function") return startLocal("Partie solo contre la banque. Vos jetons sont gardés sur cet appareil.");
  let dbc = null, uc = null;
  try { [dbc, uc] = await Promise.all([C.use("db"), C.use("user")]); } catch (e) { /* fall through */ }
  if (!dbc) return startLocal("Partie solo : la table partagée n'est pas accessible depuis cette vue (connexion requise).");
  db = dbc; userCap = uc;
  try { me = uc ? await uc.id() : null; } catch (e) { me = null; }
  try {
    const w = uc ? await uc.can("data.write") : null;
    canWrite = w !== false;
    isAdmin = uc ? await uc.canEdit() : false;
  } catch (e) { /* keep defaults */ }
  if (!me) { canWrite = false; }
  tableRef = db.doc("tables/main");
  lockRef = db.doc("locks/main");
  mode = "db";
  let sawLive = false;
  const subscribe = () => tableRef.onSnapshot(snap => {
    if (!sawLive && snap.metadata && !snap.metadata.fromCache) { sawLive = true; fxPrimed = false; }   // no fireworks for what happened before we arrived
    state = snap.exists ? snap.data() : (state && state.rev === 0 ? state : initState());
    render();
  }, err => {
    if (err && err.code === "revoked") { readOnly = true; render(); return; }
    setTimeout(subscribe, 2000);
  });
  subscribe();
}
boot();
})();
</script>
